services:
  - type: web
    name: truth-checker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_demo:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUTHCHECKER_DEMO
        value: "true"
      - key: TRUTHCHECKER_USE_LITE
        value: "1"
      - key: TRUTHCHECKER_MAX_TEXT_CHARS
        value: "20000"
      - key: TRUTHCHECKER_CACHE_TTL
        value: "900"
